services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: ecommerce_app_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: UTC
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ecommerce-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ecommerce_app_kafka
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      TZ: UTC
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ecommerce-net

  postgres:
    image: postgres:16
    container_name: ecommerce_app_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce_db
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  redis:
    image: redis:7
    container_name: ecommerce_app_redis
    ports:
      - "6379:6379"
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-net

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_app_user_service
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=:8080
      - DB_URL=postgres://user:password@postgres:5432/ecommerce_db?sslmode=disable
      - KAFKA_BROKER=kafka:9092
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=your-secure-secret-here-32-characters-long
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  postgres-data: